[station]
name = "My Radio"
# IANA timezone of the station (required) — the scheduler resolves civil times against it
timezone = "Europe/Paris"

[server]
grpc_bind = "127.0.0.1:50051"

[database]
path = "./data/stationd.db"

[media]
library_path = "./media"

# Optional — offline media analysis (Essentia). Disabled by default: while
# disabled, scans run no analysis and the typed `media_analysis` cache is only
# rebuilt from existing tags. When enabled, a scan analyses every file without
# an up-to-date analysis marker, writes the descriptors into the file tags
# (the source of truth) and mirrors them into `media_analysis`.
# `stationctl library scan --reanalyze` forces re-analysis of everything.
# [analysis]
# enabled = true
# extractor = "tools/essentia_analyze.py"  # empty = STATIOND_ESSENTIA, else default
# profile = ""                              # optional extractor profile
# timeout_secs = 90                         # hard per-file timeout
# jobs = 1                                  # reserved (analysis is sequential for now)
# max_per_scan = 0                          # 0 = unlimited; N = analyse at most N
#                                           # un-marked files per scan (chip away at
#                                           # a big library; set small to test)

# Directory holding the per-playlist TOML files (the source of truth).
[playlist]
path = "./playlist"

# Optional — the grid files (default "./grid"). Several grids may be
# prepared there; ONE is active (`stationctl schedule activate <name>`, kept
# in the database; none chosen = grid.toml). The active file is re-read at
# start-up and by `schedule reload`; `schedule save` / `apply` and the TUI
# write the files through stationd.
[grid]
path = "./grid"

# Optional — defaults to "info" if absent
[logging]
level = "info"

# Plugins (optional). `capabilities` = host calls the plugin may make on the
# core ("control", "push_override", "db"); a call outside them is refused and
# logged. "db" = the plugin's own SQLite file, `<database dir>/plugins/<name>.db`
# (name: ASCII letters, digits, `-`, `_`), bounded by an optional `[plugin.db]`.
# `enabled` (default false): a declared plugin is armed — listed by
# `stationctl plugin list`, startable by `stationctl plugin start <name>` — but
# only activated at start-up with `enabled = true`.
#
# [[plugin]]
# name = "logger"
# enabled = true
#
# Graceful stop when nobody listens: arms `stop-when-idle` on a zero listener
# sample; the station stops at the next track boundary if still at zero.
# [[plugin]]
# name = "stop-when-idle"
# capabilities = ["control"]
# [plugin.config]
# min_zero_samples = 2
# Optional: also sleep with forgotten connections (native or WASM plugin).
# Requires [icecast] listener_snapshots = true. Disabled when omitted.
# max_connection_age = "12h"
#
# Same policy as a WASM guest (plugins/stop-when-idle-wasm):
# [[plugin]]
# name = "stop-when-idle-wasm"
# wasm = "plugins/stop-when-idle-wasm/target/wasm32-unknown-unknown/release/stop_when_idle_wasm.wasm"
# capabilities = ["control"]
# [plugin.config]
# max_connection_age = "12h" # optional, requires icecast.listener_snapshots
# min_zero_samples = 2
#
# Play counts in the plugin's own database (plugins/play-stats-wasm), read with
# `stationctl plugin db play-stats query "SELECT * FROM play_count LIMIT 20"`:
# [[plugin]]
# name = "play-stats"
# wasm = "plugins/play-stats-wasm/target/wasm32-unknown-unknown/release/play_stats_wasm.wasm"
# capabilities = ["db"]
# [plugin.db]              # optional, defaults shown
# max_size_mb = 64         # file size cap
# query_timeout_ms = 200   # per host call (a db_batch as a whole)
# max_rows = 10000         # db_query result cap (more = error, not truncation)

# Listener snapshots in the plugin's own database (30-day default retention).
# Also enable listener_snapshots in [icecast] below and restart stationd.
# Build the WASM first; the path is relative to stationd's working directory.
# Configure [geoip] below for local country/city lookups with MaxMind GeoLite2 City.
# No client IP, ID or user agent is stored by this plugin.
# See Doc/listener-stats-v1.md for the event contract and query examples.
# [[plugin]]
# name = "listener-stats"
# enabled = true
# wasm = "plugins/listener-stats-wasm/target/wasm32-unknown-unknown/release/listener_stats_wasm.wasm"
# capabilities = ["db", "listener_details", "geoip"]
# [plugin.config]
# retention_days = 90                     # optional: 1..365 days, default 30
# Read: stationctl listeners stats --by day --since 7d
#       stationctl listeners stats --by week --since 4w
# Only positive audience rows are shown; periods are in UTC.

# Local geolocation shared by plugins declaring capability "geoip".
# Run interactively: sh scripts/update-geolite2.sh (MaxMind Account ID + License Key)
# Restart stationd after updating the database (loaded once into memory).
# Missing/invalid file: stats continue with status "unavailable".
# Display MaxMind attribution linking to https://www.maxmind.com with GeoLite2 results.
# [geoip]
# database = "./data/geoip/GeoLite2-City.mmdb"
# debug_log = "./data/geoip/lookup-debug.jsonl" # optional raw-IP capture, max 10 MiB

# Liquidsoap wiring (optional). Absent = nothing airs (scheduling only).
# stationd writes the generated script to `script_path` at start-up (only when
# it changed) and serves the loopback bridge Liquidsoap pulls from. Liquidsoap
# runs under its own unit (cf. Doc/liquidsoap.md): restart it after a change.
# Relative paths are resolved against stationd's working directory and handed
# to Liquidsoap as absolute paths.
#
# [liquidsoap]
# script_path   = "./data/station.liq"
# http_bind     = "127.0.0.1:8081"          # loopback only (checked)
# api_token     = "change-me"               # shared secret, X-Stationd-Token (ASCII)
# control_socket = "/run/stationd/liquidsoap.sock" # pause/resume/skip; mode 0660 —
#                                           # the stationd user must be in Liquidsoap's
#                                           # group. /run/stationd: created by the Docker
#                                           # image (init-perms); default ./data/liquidsoap.sock
# fallback_path = "./radio/error.mp3"       # safety net: nothing to air / stationd down
#                                           # default: /usr/share/stationd/error.mp3
#                                           # (production image only)
# halted_path   = "./radio/bruit.mp3"       # looped while paused/sleeping/stopped
#                                           # default: /usr/share/stationd/bruit.mp3
# normalize     = false                     # normalize + compress on the air chain
# custom_include = "/etc/stationd/custom.liq"  # sees `radio`, may reassign it
# log_level     = 3
# [liquidsoap.crossfade]
# mode     = "simple"                       # "simple" | "none"
# fade     = 2.0                            # fade in/out, s
# duration = 3.0                            # overlap, s
#
# [[liquidsoap.output]]
# host     = "127.0.0.1"
# port     = 8000
# password = "hackme"
# mount    = "/radio.mp3"
# bitrate  = 192                            # mp3 (format = "mp3", the only one for now)
# description = ""
# genre    = ""
# public   = false

# Public metadata: first matching tag wins. No match = file metadata unchanged.
# Without origin, tag matches any merged library genre (including custom-tags).
# With origin, "" means native genre, "Type" means that configured TXXX source.
# [[liquidsoap.metadata_rule]]
# tag = "jingle"
# origin = "Type"
# text = "Ma Radio"                         # replaces title/song; clears artist/album
#
# [[liquidsoap.metadata_rule]]
# tag = "speech"
# fields = ["title"]                        # hide artist and album; [] hides everything
# Allowed fields: title, artist, album. Default: all three. text takes precedence.
# Restart stationd and Liquidsoap after changing these rules.
#
# Live DJ (optional, requires [liquidsoap]): a harbor input in the generated
# script. Who may connect: the DJ file (kept apart, it holds argon2 hashes —
# `stationctl dj hash`; re-read at every login). When: the grid's `live`
# rules (dj + start, open until the next slot starts), an ad-hoc opening
# (`stationctl live open <dj> --for 2h`, persisted, `live close <dj>`), or the
# permanent right (`urgent = true` in the DJ file: urgent live at any time,
# never over another live). The live airs above everything with a short
# fade; it ends on disconnection or after silence_timeout seconds of silence.
# A DJ cut (silence or kick) loses the way it came in: a slot or an opening
# until its end, the urgent right for urgent_cooldown seconds.
# Open harbor_port to the DJs (firewall / NAT), nothing else.
#
# [live]
# djs_path          = "./djs.toml"
# harbor_port       = 8005
# mount             = "/live"
# fade              = 1.5                   # s, taking and giving back the air (0 = none)
# silence_timeout   = 30                    # s, 5..=3600
# silence_threshold = -40.0                 # dBFS
# buffer            = 5.0                   # s of the DJ stream buffered before it airs
# urgent_cooldown   = 600                   # s, urgent right closed after a cut (0..=86400)
#
# djs.toml (mode 0640):
#   schema_version = 1
#   [[dj]]
#   id            = "marc"                  # grid `dj = "marc"`, harbor login user
#   name          = "Marc"                  # optional
#   password_hash = "$argon2id$v=19$..."    # stationctl dj hash
#   enabled       = true                    # default
#   urgent        = false                   # default; true = may take the air at any time
# A software without user name: user `source`, password `marc,<password>`.

# Icecast admin access (optional, requires [liquidsoap]). stationd samples
# /admin/stats every poll_interval seconds: the listeners of the mounts it
# feeds ([[liquidsoap.output]]) → ListenersSampled (stop-when-idle). A failed
# read — Icecast down, bad credentials, mount without source — makes the
# audience unknown, never 0: a draining station keeps playing, a sleeping
# one wakes. While asleep it samples every poll_interval_sleeping seconds
# (the wake latency when a listener comes back).
# Admin credentials (<admin-user>/<admin-password> of icecast.xml), NOT the
# source password. Plain http, Icecast reached directly (not via the proxy).
#
# [icecast]
# admin_url      = "http://127.0.0.1:8000"
# admin_user     = "admin"                  # default
# admin_password = "change-me-admin"        # ASCII
# poll_interval  = 15                       # seconds, 2..=600
# poll_interval_sleeping = 3                # seconds while asleep, 2..=600
# listener_snapshots = true                # opt in; default false
# Detailed events only reach plugins with capability "listener_details".
#
# Optional: stationd generates Icecast's own config (icecast.xml) — one mount
# per [[liquidsoap.output]] with its source password, UTF-8 titles, only our
# mounts can be fed (no global source password), trusted reverse proxies.
# Names come from [station] name; public listen URLs belong to the reverse
# proxy (Icecast's hostname stays localhost).
# Written at start-up when it changed (mode 0640, holds the passwords):
# Icecast reads it through `file_group`, the group shared by stationd and
# Icecast created at install (cf. Doc/liquidsoap.md). Restart Icecast to
# apply. admin_url and every output must use `port`.
# [icecast.server]
# config_path     = "./data/icecast.xml"    # icecast2 -c <this>
# file_group      = "stationd"              # stationd must be a member; default: its own group
# port            = 8000
# bind_address    = "0.0.0.0"               # default: all interfaces
# admin_email     = "icemaster@localhost"
# max_clients     = 100
# trusted_proxies = ["192.168.1.94"]        # X-Forwarded-For (Icecast 2.5), exact IPs
# share_dir       = "/usr/share/icecast2"   # Icecast's web/, admin/, report-db.xml
# log_dir         = "/var/log/icecast2"

# Optional scan enrichment. Audio files are read only; output is in media_meta.
# Rebuild the WASM plugin and rescan the library after changing these rules.
# [[plugin]]
# name = "custom-tags"
# enabled = true
# No wasm path needed: custom_tags_wasm.wasm is found automatically.
# wasm = "/custom/path/custom_tags_wasm.wasm"  # optional override
# [plugin.config]
# tags = ["Type"]                 # Existing Type values still become genres.
# [plugin.config.creation]
# enabled = true
# source_tags = ["Description", "Comment"]
# match = "made with suno; created="  # Literal, case-sensitive, configurable.
# date_format = "rfc3339"
# [plugin.config.tempo]
# enabled = true
# analyze_missing = true          # Default: estimate missing MP3 BPM offline.
# Requires FFmpeg; writes TBPM and TXXX:tempo without playing on air.
# analyze_range = [70, 180]       # Default. Half / double time are folded into
#                                 # this window (a whole octave: upper ≥ 2 × lower).
#                                 # A true 60 BPM reads 120 here; [50, 100] keeps it.
# source_tags = ["BPM"]
# [[plugin.config.tempo.range]]
# max = 79.999
# value = "slow"
# [[plugin.config.tempo.range]]
# min = 80
# max = 119.999
# value = "medium"
# [[plugin.config.tempo.range]]
# min = 120
# value = "fast"
# Ranges are inclusive; gaps produce no tempo and overlaps are rejected.
# In a dynamic playlist, use for example:
# [[selection.filter]]
# field = "tempo"
# op = "eq"
# value = "fast"
# [[selection.filter]]
# field = "creation"
# op = ">="
# value = "2026-06-01T00:00:00Z"

# Generic plugin configuration editor in the TUI. No capabilities required.
# Start with stop-when-idle; rebuild its WASM variant to expose config_schema.
# See Doc/plugin-config.md.
# [[plugin]]
# name = "plugin-config"
# enabled = true
# Remote supervision (Webmin), native plugin: passkeys and station-scoped roles.
# HTTPS reverse proxy required. Capability db enables identity/session persistence.
# One gateway can supervise several stations; endpoints are configured server-side.
# The first screen after login will be a network summary, then station detail.
# Loopback binding only in tranche A; HTTPS is terminated by the reverse proxy.
# See Doc/Webmin-implementation.md for limits and scope.
# [[plugin]]
# name = "remote-supervision"
# enabled = false
# capabilities = ["db"]
# [plugin.config]
# bind = "127.0.0.1:8090"
# public_url = "https://remote.homestone.rp-radio.live"
# max_requests = 128              # Concurrent handler executions, 1..1024
# request_timeout_seconds = 5     # Handler deadline, 1..60
# shutdown_timeout_seconds = 2    # Grace before closing connections, 1..10
# session_ttl_seconds = 43200     # Absolute Web session lifetime, 60..86400
# enrollment_ttl_seconds = 900    # One-use enrollment URL lifetime, 60..86400
# auth_requests_per_minute = 120  # Per peer IP; forwarded headers are ignored
# password_min_length = 12       # Unicode characters, 1..password_max_length
# password_max_length = 256      # Unicode characters, password_min_length..256
# [[plugin.config.stations]]
# id = "home-stone"               # Stable, unique ID for URLs and future permissions
# label = "Home Stone"
# grpc_endpoint = "http://127.0.0.1:50051"
# [[plugin.config.stations]]
# id = "second-station"
# label = "Second Station"
# grpc_endpoint = "https://second.internal.example:50051"
# HTTP gRPC is for a trusted internal transport only; never expose it publicly.
# The catalogue is validated but no gRPC connection is opened in tranche A.
