[station]
name = "My Radio"
# IANA timezone of the station (required) — the scheduler resolves civil times against it
timezone = "Europe/Paris"

[server]
grpc_bind = "127.0.0.1:50051"

[database]
path = "./data/stationd.db"

[media]
library_path = "./media"

# Directory holding the per-playlist TOML files (the source of truth).
[playlist]
path = "./playlist"

# Optional — defaults to "info" if absent
[logging]
level = "info"

# Plugins (optional). `capabilities` = host calls the plugin may make on the
# core ("control", "push_override"); a call outside them is refused and logged.
#
# [[plugin]]
# name = "logger"
#
# Graceful stop when nobody listens: arms `stop-when-idle` on a zero listener
# sample; the station stops at the next track boundary if still at zero.
# [[plugin]]
# name = "stop-when-idle"
# capabilities = ["control"]
# [plugin.config]
# min_zero_samples = 2
#
# Same policy as a WASM guest (plugins/stop-when-idle-wasm):
# [[plugin]]
# name = "stop-when-idle-wasm"
# wasm = "plugins/stop-when-idle-wasm/target/wasm32-unknown-unknown/release/stop_when_idle_wasm.wasm"
# capabilities = ["control"]

# Liquidsoap wiring (optional). Absent = nothing airs (scheduling only).
# stationd writes the generated script to `script_path` at start-up (only when
# it changed) and serves the loopback bridge Liquidsoap pulls from. Liquidsoap
# runs under its own unit (cf. Doc/liquidsoap.md): restart it after a change.
# Relative paths are resolved against stationd's working directory and handed
# to Liquidsoap as absolute paths.
#
# [liquidsoap]
# script_path   = "./data/station.liq"
# http_bind     = "127.0.0.1:8081"          # loopback only (checked)
# api_token     = "change-me"               # shared secret, X-Stationd-Token (ASCII)
# control_socket = "/run/stationd/liquidsoap.sock" # pause/resume/skip; mode 0660 —
#                                           # the stationd user must be in Liquidsoap's
#                                           # group. /run/stationd: created by the Docker
#                                           # image (init-perms); default ./data/liquidsoap.sock
# fallback_path = "/srv/radio/error.mp3"    # safety net: nothing to air / stationd down
# halted_path   = "/srv/radio/noise.mp3"    # looped while paused/stopped
# normalize     = false                     # normalize + compress on the air chain
# custom_include = "/etc/stationd/custom.liq"  # sees `radio`, may reassign it
# log_level     = 3
# [liquidsoap.crossfade]
# mode     = "simple"                       # "simple" | "none"
# fade     = 2.0                            # fade in/out, s
# duration = 3.0                            # overlap, s
#
# [[liquidsoap.output]]
# host     = "127.0.0.1"
# port     = 8000
# password = "hackme"
# mount    = "/radio.mp3"
# bitrate  = 192                            # mp3 (format = "mp3", the only one for now)
# name     = "My Radio"                     # default: [station] name
# description = ""
# genre    = ""
# public   = false

# Live DJ (optional, requires [liquidsoap]): a harbor input in the generated
# script. Who may connect: the DJ file (kept apart, it holds argon2 hashes —
# `stationctl dj hash`; re-read at every login). When: the grid's `live`
# rules (dj + start, open until the next slot starts). The live airs above
# everything with a short fade; it ends on disconnection or after
# silence_timeout seconds of silence (the DJ is then refused until the end
# of its slot). Open harbor_port to the DJs (firewall / NAT), nothing else.
#
# [live]
# djs_path          = "./djs.toml"
# harbor_port       = 8005
# mount             = "/live"
# fade              = 1.5                   # s, taking and giving back the air (0 = none)
# silence_timeout   = 30                    # s, 5..=3600
# silence_threshold = -40.0                 # dBFS
# buffer            = 5.0                   # s of the DJ stream buffered before it airs
#
# djs.toml (mode 0640):
#   schema_version = 1
#   [[dj]]
#   id            = "marc"                  # grid `dj = "marc"`, harbor login user
#   name          = "Marc"                  # optional
#   password_hash = "$argon2id$v=19$..."    # stationctl dj hash
#   enabled       = true                    # default
# A software without user name: user `source`, password `marc,<password>`.

# Icecast admin access (optional, requires [liquidsoap]). stationd samples
# /admin/stats every poll_interval seconds: the listeners of the mounts it
# feeds ([[liquidsoap.output]]) → ListenersSampled (stop-when-idle). A failed
# read — Icecast down, bad credentials, mount without source — makes the
# audience unknown, never 0: a draining station keeps playing.
# Admin credentials (<admin-user>/<admin-password> of icecast.xml), NOT the
# source password. Plain http, Icecast reached directly (not via the proxy).
#
# [icecast]
# admin_url      = "http://127.0.0.1:8000"
# admin_user     = "admin"                  # default
# admin_password = "change-me-admin"        # ASCII
# poll_interval  = 15                       # seconds, 2..=600
#
# Optional: stationd generates Icecast's own config (icecast.xml) — one mount
# per [[liquidsoap.output]] with its source password, UTF-8 titles, only our
# mounts can be fed (no global source password), trusted reverse proxies.
# Written at start-up when it changed (mode 0640, holds the passwords):
# Icecast reads it through `file_group`, the group shared by stationd and
# Icecast created at install (cf. Doc/liquidsoap.md). Restart Icecast to
# apply. admin_url and every output must use `port`.
# [icecast.server]
# config_path     = "./data/icecast.xml"    # icecast2 -c <this>
# file_group      = "stationd"              # stationd must be a member; default: its own group
# port            = 8000
# bind_address    = "0.0.0.0"               # default: all interfaces
# hostname        = "radio.example"         # public host name
# location        = "Earth"                 # default: [station] name
# admin_email     = "icemaster@localhost"
# max_clients     = 100
# trusted_proxies = ["192.168.1.94"]        # X-Forwarded-For (Icecast 2.5), exact IPs
# share_dir       = "/usr/share/icecast2"   # Icecast's web/, admin/, report-db.xml
# log_dir         = "/var/log/icecast2"
