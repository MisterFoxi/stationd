[package]
name = "stationdeck-control"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
stationdeck-discovery = { path = "../stationdeck-discovery" }
stationd-proto = { path = "../stationd-proto" }
stationdeck-services = { path = "../stationdeck-services" }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "process", "io-util"] }
tonic = { version = "0.12", features = ["tls-native-roots"] }
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

tokio-stream = { version = "0.1", features = ["net"] }
