[package]
name = "stationdeck-ui"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
egui = { version = "=0.34.3", default-features = false }
stationdeck-services = { path = "../stationdeck-services" }

[features]
ui-test = ["dep:web-sys"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", optional = true, features = ["Window", "Document", "Element"] }
