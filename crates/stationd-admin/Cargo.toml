[package]
name = "stationd-admin"
version = "1.0.0"
edition = "2021"
publish = false
default-run = "station-admin"

# Socle V1 autonome : ne dépend pas du daemon StationD 0.5.
[workspace]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tonic = "0.12"
prost = "0.13"
reqwest = { version = "0.12", default-features = false }
roxmltree = "0.20"

[build-dependencies]
tonic-build = "0.12"

