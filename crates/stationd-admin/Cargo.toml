[package]
name = "stationd-admin"
version = "1.0.0"
edition = "2021"
publish = false
default-run = "station-admin"

# Socle V1 autonome : ne dépend pas du daemon StationD 0.5.
[workspace]

[dependencies]
anyhow = "1"
station-icecast-config = { path = "../../tools/icecast-config" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync", "io-util"] }
tonic = "0.12"
prost = "0.13"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false }
roxmltree = "0.20"
extism = { version = "=1.30.0", default-features = false }
rusqlite = { version = "0.30", features = ["hooks", "limits", "bundled"] }
thiserror = "1"
# Extism 1.30 expects Wasmtime errors to use the same anyhow ABI as StationD.
wasmtime = { version = "43", default-features = false, features = ["anyhow"] }

[build-dependencies]
tonic-build = "0.12"


[dev-dependencies]
tempfile = "3"
