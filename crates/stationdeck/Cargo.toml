[package]
name = "stationdeck"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
icecastd-deck = { path = "../../plugins/icecastd-deck" }
stationdeck-icecast = { path = "../stationdeck-icecast" }
stationdeck-services = { path = "../stationdeck-services" }
stationdeck-ui = { path = "../stationdeck-ui" }
stationdeck-demo = { path = "../stationdeck-demo" }
stationdeck-grpc = { path = "../stationdeck-grpc" }
stationdeck-config-ui = { path = "../stationdeck-config-ui" }
egui = { version = "=0.34.3", default-features = false, features = ["default_fonts"] }
serde = { version = "1", features = ["derive"] }
egui_tracing = { version = "=0.3.0", default-features = false, features = ["wasmbind"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "=0.34.3", default-features = false, features = ["default_fonts", "glow", "persistence"] }
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "Window", "Storage"] }

serde_json = "1"

[features]
ui-test = ["stationdeck-ui/ui-test"]
