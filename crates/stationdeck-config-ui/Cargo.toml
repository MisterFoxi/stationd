[package]
name = "stationdeck-config-ui"
version = "0.1.0"
edition = "2021"
publish = false
[dependencies]
stationdeck-ui = { path = "../stationdeck-ui" }
stationdeck-services = { path = "../stationdeck-services" }
egui = { version = "=0.34.3", default-features = false }
serde_json = "1"
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
gloo-net = "0.6"
gloo-timers = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["AbortController", "AbortSignal"] }
