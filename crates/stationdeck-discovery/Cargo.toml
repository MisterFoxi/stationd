[package]
name = "stationdeck-discovery"
version = "0.1.0"
edition = "2021"
publish = false
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
hmac = "0.12"
uuid = { version = "1", features = ["v4"] }
url = "2"
tokio = { version = "1", features = ["net", "time", "rt", "macros", "signal"] }
