// library_v1.proto
// ─────────────────────────────────────────────────────────────────────────
// La BIBLIOTHÈQUE média : index (famille A) reconstructible par scan du
// filesystem (racine = config station `media.library_path`). stationd LIT les
// tags STANDARD (titre/artiste/album/genre/année/durée) — cf. « Périmètre de
// stationd » : tout attribut non standard relève d'un plugin, le catalogue de
// champs est fermé.
//
// No-silent-failure : un fichier illisible / de durée nulle n'entre pas dans
// l'index, il est REMONTÉ dans le rapport de scan (Skip), jamais avalé. Une
// extension non-audio est simplement ignorée (pas une erreur).
//
// Réconciliation (pas de DROP brutal) : un scan repasse tout `available = 0`
// puis ré-affirme les fichiers vus ; un disparu reste connu, marqué indispo.

syntax = "proto3";

package webradio.library.v1;

// CLI-first : stationctl library scan|list passe directement par ce contrat.
service LibraryService {
  // Scanne la racine média configurée et réconcilie l'index. Côté serveur, le
  // travail lourd (walk + parse des tags) part sur un pool bloquant ; l'acteur
  // biblio sérialise les scans (jamais deux en parallèle).
  rpc Scan(ScanRequest) returns (ScanResponse);

  // Liste l'index média. `only_available` exclut les fichiers disparus (gardés
  // en base, marqués indisponibles).
  rpc ListMedia(ListMediaRequest) returns (ListMediaResponse);

  // Inventaire des genres : nombre de médias par genre, insensible à la casse
  // (repli Unicode, « Électro » = « électro »), + nombre de médias sans genre.
  rpc ListGenres(ListGenresRequest) returns (ListGenresResponse);

  // Recherche paginée (écran Médias, sélecteur de médias) : texte, filtres,
  // tri stable (clé puis chemin), pagination par curseur, total. Lecture
  // seule ; ListMedia reste pour le CLI (tout d'un coup).
  rpc SearchMedia(SearchMediaRequest) returns (SearchMediaResponse);

  // Oublie les médias disparus du disque (lignes available = 0 et leurs
  // genres). `older_than` ("30d", "12h"…) : seulement ceux que le dernier
  // scan qui les a vus date d'avant ; vide = tous. L'historique de diffusion
  // garde son chemin et son artiste.
  rpc Prune(PruneRequest) returns (PruneResponse);

  // Les tags tels qu'ils sont dans le fichier — titre, artiste, album,
  // année, genres (TCON, toutes les valeurs), BPM (TBPM), tags utilisateur
  // (TXXX) — avec leur révision, et ce qu'il faut pour les modifier : les
  // TXXX que le plugin custom-tags transforme en genres, les libellés de
  // tempo proposés, le tempo et la date de création effectifs. not_found si
  // le fichier n'est pas sous la racine.
  rpc GetTags(GetTagsRequest) returns (MediaTags);

  // Écrit des tags DANS le fichier (stationd seul écrit), puis relit le
  // fichier (vérification après écriture, NFS) et le repasse comme un scan :
  // plugins on_scan, valeurs manuelles (tempo_manual / creation_manual
  // l'emportent sur les valeurs dérivées), réécriture de TXXX:tempo /
  // TXXX:creation, index et media_meta à jour. Seuls les champs présents
  // changent ; texte vide / 0 / liste vide = champ retiré. `revision` (de
  // GetTags) : si les tags du fichier ont changé depuis, rien n'est écrit
  // (conflict). La date de modification du fichier est conservée. ID3v2
  // seulement (mp3, wav, aiff) : autre format = failed_precondition ; valeur
  // invalide = invalid_argument.
  rpc SetTags(SetTagsRequest) returns (SetTagsResponse);
}

message GetTagsRequest {
  string rel_path = 1;
}

message MediaTags {
  string rel_path = 1;
  string title    = 2;   // vide = absent
  string artist   = 3;
  string album    = 4;
  uint32 year     = 5;   // 0 = absente
  reserved 6;            // (genre unique, remplacé par `genres`)
  string revision = 7;   // à renvoyer dans SetTags
  repeated string genres = 8;          // TCON, toutes les valeurs, dans l'ordre du fichier
  repeated TagValues sources = 9;      // TXXX qui deviennent des genres (config de custom-tags)
  uint32 bpm = 10;                     // TBPM, 0 = absent
  string tempo_manual = 11;            // TXXX:tempo_manual (vide = aucun)
  string creation_manual = 12;         // TXXX:creation_manual (RFC 3339, vide = aucune)
  string tempo = 13;                   // tempo effectif (index), vide = aucun
  string creation = 14;                // date de création effective (index), vide = aucune
  repeated string tempo_choices = 15;  // libellés des plages de custom-tags, puis ceux déjà utilisés
}

// Un tag à plusieurs valeurs.
message TagValues {
  string name = 1;
  repeated string values = 2;
}

// Une liste présente = remplacée (vide = retirée).
message StringList {
  repeated string values = 1;
}

message SetTagsRequest {
  string rel_path = 1;
  string revision = 2;           // vide = sans contrôle
  optional string title  = 3;    // absent = inchangé ; "" = retiré
  optional string artist = 4;
  optional string album  = 5;
  optional uint32 year   = 6;    // 0 = retirée
  reserved 7;                    // (genre unique)
  StringList genres = 8;         // absente = inchangés ; liste vide = TCON retiré
  repeated TagValues sources = 9;  // chaque TXXX nommé est remplacé (liste vide = retiré)
  optional uint32 bpm = 10;      // 0 = retiré
  optional string tempo_manual = 11;     // "" = retiré (le tempo redevient celui du BPM)
  optional string creation_manual = 12;  // RFC 3339 ; "" = retirée
}

message SetTagsResponse {
  // Les tags du fichier ont changé depuis `revision` : rien n'est écrit,
  // `tags` = ce qu'ils sont maintenant.
  bool conflict = 1;
  MediaTags tags = 2;   // relus après écriture (ou actuels si conflit)
  Media media   = 3;    // la ligne de l'index après mise à jour (absente si conflit)
}

message PruneRequest {
  string older_than = 1;
}

message PruneResponse {
  uint64 removed = 1;
}

message ScanRequest {}

message ScanResponse {
  uint32 found       = 1;   // fichiers jouables trouvés à ce scan
  uint32 skipped     = 2;   // fichiers d'extension audio écartés (avec raison)
  uint32 present     = 3;   // lignes available après réconciliation
  uint32 unavailable = 4;   // lignes connues mais disparues (available = 0), tous scans confondus
  uint32 vanished    = 6;   // disponibles avant ce scan et non revus : disparus À CE SCAN
  repeated Skip skips = 5;
}

// Un fichier d'extension audio écarté, avec sa raison — surfacé, jamais avalé.
message Skip {
  string path   = 1;        // rel_path (ou chemin brut si hors racine)
  Reason reason = 2;
  string detail = 3;        // message lofty/IO pour UNREADABLE / WALK_ERROR
  enum Reason {
    REASON_UNSPECIFIED = 0;
    UNREADABLE    = 1;      // lofty n'a pas pu parser (corrompu, tronqué…)
    ZERO_DURATION = 2;      // durée nulle → impossible à placer par le scheduler
    WALK_ERROR    = 3;      // échec du parcours (permissions…)
  }
}

message ListMediaRequest {
  bool only_available = 1;
  // Filtre genre, insensible à la casse. Un média est gardé s'il porte AU MOINS
  // UN de ces genres (any). Vide = pas de filtre. Entrée vide = INVALID_ARGUMENT.
  repeated string genres = 2;
}

message ListGenresRequest {
  bool only_available = 1;
}

message ListGenresResponse {
  repeated GenreCount genres = 1;   // trié par clé repliée (ordre alphabétique)
  uint32 untagged            = 2;   // médias sans aucun genre
}

// Un genre, toutes graphies confondues (repli de casse).
message GenreCount {
  string genre              = 1;   // libellé : graphie la plus fréquente
  uint32 count              = 2;   // médias distincts portant ce genre
  repeated string spellings = 3;   // graphies rencontrées ; > 1 = tags incohérents
}

message ListMediaResponse {
  repeated Media media = 1;
}

// Champs STANDARD uniquement. year = 0 / chaînes vides = métadonnée absente
// (source dégradée, pas une erreur). duration_ms strictement positif par
// construction (une durée nulle est écartée au scan).
message Media {
  string rel_path        = 1;   // relatif à media/, séparateur '/', casse conservée
  string title           = 2;
  string artist          = 3;
  string album           = 4;
  uint32 year            = 5;
  uint64 duration_ms     = 6;
  uint64 size_bytes      = 7;
  bool   available       = 8;
  repeated string genres = 9;   // ensemble (0..n)
}

// ─────────────────────────────────────────────────────────────────────────
// SearchMedia
// ─────────────────────────────────────────────────────────────────────────

message SearchMediaRequest {
  // Mots cherchés dans titre, artiste, album et chemin, insensible à la casse
  // (Unicode) : un média est gardé si CHAQUE mot apparaît dans l'un d'eux.
  // Vide = pas de filtre texte.
  string query = 1;
  // Genres (au moins un, insensible à la casse). Vide = pas de filtre.
  repeated string genres = 2;
  // Dossier : préfixe du chemin (`Musique/Rock`), insensible à la casse ;
  // un `/` final est ajouté s'il manque. Vide = toute la bibliothèque.
  string folder = 3;
  // Inclure les médias disparus du disque (available = false).
  bool include_unavailable = 4;
  // Métadonnées manquantes : garde les médias à qui il manque TOUTES celles-ci.
  repeated Field missing = 5;
  Field sort = 6;          // FIELD_UNSPECIFIED = chemin
  bool descending = 7;
  uint32 limit = 8;        // 0 = 50, plafonné à 500
  string cursor = 9;       // `next_cursor` de la page précédente ; vide = début

  enum Field {
    FIELD_UNSPECIFIED = 0;
    PATH     = 1;
    TITLE    = 2;
    ARTIST   = 3;
    ALBUM    = 4;
    YEAR     = 5;
    DURATION = 6;
    GENRE    = 7;          // pour `missing` seulement (pas un tri)
  }
}

message SearchMediaResponse {
  repeated Media media = 1;
  uint64 total = 2;          // médias correspondant aux filtres (toutes pages)
  string next_cursor = 3;    // vide = dernière page
}
