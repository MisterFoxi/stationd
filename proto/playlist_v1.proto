// playlist_v1.proto
// ─────────────────────────────────────────────────────────────────────────
// Les PLAYLISTS : un fichier TOML par playlist sous la racine des playlists
// du nœud (`[playlist] path`), source de vérité ; la table SQLite n'est qu'une
// vue reconstructible. stationd est le seul à écrire cette racine (Save,
// Remove, id réécrit par Sync) : un client, local ou distant, n'écrit jamais
// de fichier de playlist.
//
// Le format d'échange est le TOML lui-même (la grammaire des fichiers, 5
// modes : static, dynamic, remote, queue, group — cf. examples/ et
// Doc/playlists.md). Pas de message typé par mode : le client qui présente un
// formulaire lit et écrit du TOML, stationd seul valide.
//
// Référence d'une playlist (`reference`) : son ref (chemin relatif canonique
// sous la racine, ex. `emission/intro`, insensible à la casse, `.toml`
// facultatif) ou son UUID (seule prise d'une entrée ajoutée par Add, sans
// fichier).
//
// Révision : empreinte du CONTENU du fichier sur le disque (`sha256:<hex>`),
// pas sa date (plus fiable sur NFS). Vide = pas de fichier.

syntax = "proto3";

package webradio.playlist.v1;

service PlaylistService {
  // Ce que la vue contient (lecture seule).
  rpc List(ListRequest) returns (ListResponse);

  // Une playlist : le TOML appliqué (la vue) et celui du fichier, avec sa
  // révision (à renvoyer dans Save / Remove).
  rpc Export(ExportRequest) returns (ExportResponse);

  // Valide un brouillon sans rien appliquer ni écrire : diagnostics par
  // champ, y compris les références de groupe et les cycles vus avec la vue
  // actuelle. `reference` (facultatif) = où il serait enregistré : sert aux
  // refs relatives (`./x`) d'un groupe et à la détection de cycle.
  rpc Validate(ValidateRequest) returns (ValidateResponse);

  // Évalue le pool d'un brouillon sans l'appliquer : nombre de médias,
  // durée, échantillon ; par membre pour un groupe. Diagnostics si invalide.
  rpc PreviewPool(PreviewPoolRequest) returns (PreviewPoolResponse);

  // Valide, écrit le fichier (écriture atomique, relue), applique à la vue.
  // `expected_revision` vide = création (refusée si le fichier existe) ;
  // différente de la révision sur le disque = conflit, rien n'est écrit.
  // Invalide = `ok = false` + diagnostics, rien n'est écrit (pas une erreur
  // gRPC : c'est la réponse attendue d'un formulaire).
  rpc Save(SaveRequest) returns (SaveResponse);

  // Supprime le fichier PUIS la ligne (fichier d'abord : sinon le prochain
  // Sync la ferait revenir). Refusé (failed_precondition) tant qu'une règle
  // de grille ou un groupe la référence ; not_found pour une référence
  // inconnue ; aborted si `expected_revision` ne correspond plus au fichier.
  rpc Remove(RemoveRequest) returns (RemoveResponse);

  // Relit toute la racine : ajoute / met à jour (au mieux : un fichier
  // invalide est signalé, les autres passent), id réécrit dans les fichiers
  // qui n'en ont pas.
  rpc Sync(SyncRequest) returns (SyncResponse);

  // Sync + retrait des lignes dont le fichier a disparu (sauf si une règle ou
  // un groupe restant les référence : gardées, signalées).
  rpc Reload(ReloadRequest) returns (ReloadResponse);

  // Enregistre dans la vue un TOML venu d'ailleurs, SANS fichier (entrée
  // « ajoutée », désignée par son UUID) ; renvoie le TOML avec son id. Pour
  // une playlist qui vit dans la racine, utiliser Save.
  rpc Add(AddRequest) returns (AddResponse);
}

// ─────────────────────────────────────────────────────────────────────────
// Diagnostics
// ─────────────────────────────────────────────────────────────────────────

// Un problème, rattaché au champ qui le porte. `field_path` suit la
// grammaire TOML : `selection.order`, `broadcast.constraints.no_same_track_within`,
// `selection.filter[2].value`, `selection.members[1].ref` — index à partir
// de 1 (« le 2e filtre »). Vide = le fichier entier (TOML illisible, champ
// racine manquant).
message Diagnostic {
  enum Severity {
    SEVERITY_UNSPECIFIED = 0;
    ERROR   = 1;   // bloque Save
    WARNING = 2;   // n'empêche pas l'enregistrement (ex. pool vide)
  }
  Severity severity = 1;
  string file       = 2;   // ref de la playlist concernée (vide = le brouillon)
  string field_path = 3;
  string rejected   = 4;   // valeur rejetée, telle qu'écrite (vide si absente)
  string expected   = 5;   // valeurs admises quand elles sont finies
  string message    = 6;   // phrase anglaise (stationctl) ; les clients traduisent par `code`
  Code   code       = 7;

  // Nature du problème : un client traduit par ce code, jamais en analysant
  // `message`.
  enum Code {
    CODE_UNSPECIFIED     = 0;
    SYNTAX               = 1;   // TOML illisible
    UNKNOWN_FIELD        = 2;   // champ inconnu (grammaire stricte)
    MISSING_FIELD        = 3;   // champ obligatoire absent
    BAD_VALUE            = 4;   // valeur d'un type ou d'une forme invalide
    NOT_ALLOWED          = 5;   // champ interdit dans ce mode / cette stratégie
    REQUIRED_FOR_MODE    = 6;   // champ requis par ce mode / cette stratégie
    CONFLICT             = 7;   // champs incompatibles entre eux
    BAD_FILTER           = 8;   // filtre dynamique invalide (champ, opérateur, valeur)
    BAD_DURATION         = 9;   // durée hors grammaire (30s, 15m, 2h, 1d)
    UNKNOWN_REF          = 10;  // membre qui ne désigne aucune playlist
    BAD_REF              = 11;  // ref invalide (`..` au-dessus de la racine, dossier…)
    CYCLE                = 12;  // groupe qui se contient, directement ou non
    ID_CHANGED           = 13;  // `id` différent de celui du fichier existant
    EMPTY_POOL           = 14;  // (avertissement) aucun média ne correspond aujourd'hui
  }
}

// ─────────────────────────────────────────────────────────────────────────
// List / Export
// ─────────────────────────────────────────────────────────────────────────

message ListRequest {}

message ListResponse {
  repeated PlaylistSummary playlists = 1;
}

message PlaylistSummary {
  string id       = 1;   // UUID interne
  string rel_path = 2;   // ref ; vide pour une entrée ajoutée (sans fichier)
  string name     = 3;
  string mode     = 4;   // static | dynamic | remote | queue | group
  bool   enabled  = 5;
}

message ExportRequest {
  string reference = 1;
}

message ExportResponse {
  string id           = 1;
  string rel_path     = 2;
  string applied_toml = 3;   // ce que stationd a appliqué (la vue)
  string file         = 4;   // fichier, relatif à la racine ; vide = aucun
  string file_toml    = 5;   // contenu du fichier (commentaires compris) ; vide = aucun
  string revision     = 6;   // révision du fichier ; vide = aucun
  // Le fichier diffère de ce qui est appliqué (modifié à la main depuis le
  // dernier Sync / Save, ou invalide).
  bool   file_differs = 7;
}

// ─────────────────────────────────────────────────────────────────────────
// Validate / PreviewPool / Save
// ─────────────────────────────────────────────────────────────────────────

message ValidateRequest {
  string toml      = 1;
  string reference = 2;   // facultatif : où il serait enregistré
}

message ValidateResponse {
  bool ok = 1;                          // aucun diagnostic ERROR
  repeated Diagnostic diagnostics = 2;
}

message PreviewPoolRequest {
  string toml      = 1;
  string reference = 2;   // facultatif : base des refs relatives d'un groupe
  uint32 sample    = 3;   // taille de l'échantillon (0 = 20, plafonné à 100)
}

message PreviewPoolResponse {
  bool ok = 1;                          // brouillon valide et pool évalué
  repeated Diagnostic diagnostics = 2;
  // Absents quand le pool n'est pas mesurable (remote, queue, brouillon
  // invalide).
  optional uint64 count       = 3;      // médias disponibles retenus
  optional uint64 duration_ms = 4;      // durée totale connue
  optional uint64 artists     = 5;      // artistes distincts (feuille seulement)
  repeated PoolMedia sample   = 6;      // premiers médias, triés par chemin
  repeated MemberPool members = 7;      // groupe : un par membre, dans l'ordre
}

message PoolMedia {
  string rel_path    = 1;
  string title       = 2;
  string artist      = 3;
  uint64 duration_ms = 4;
}

message MemberPool {
  string ref                  = 1;   // tel qu'écrit dans le groupe
  string resolved             = 2;   // ref canonique ; vide si non résolu
  optional uint64 count       = 3;
  optional uint64 duration_ms = 4;
  string error                = 5;   // pourquoi ce membre n'est pas mesuré
}

message SaveRequest {
  string reference         = 1;   // ref cible (chemin relatif sous la racine)
  string toml              = 2;
  string expected_revision = 3;   // vide = création
}

message SaveResponse {
  bool ok = 1;                          // écrit et appliqué
  repeated Diagnostic diagnostics = 2;  // erreurs (rien écrit) ou avertissements
  bool conflict = 3;                    // révision attendue ≠ fichier : rien écrit
  string revision = 4;                  // révision après écriture (ou actuelle si conflit)
  string toml = 5;                      // contenu écrit (id injecté si absent)
  string id = 6;
  string file = 7;                      // fichier, relatif à la racine
  bool created = 8;
}

// ─────────────────────────────────────────────────────────────────────────
// Remove / Sync / Reload / Add
// ─────────────────────────────────────────────────────────────────────────

message RemoveRequest {
  string reference         = 1;
  string expected_revision = 2;   // facultatif : refuse si le fichier a changé
}

message RemoveResponse {
  string id       = 1;
  string rel_path = 2;   // vide pour une entrée ajoutée
  string file     = 3;   // fichier supprimé ; vide = aucun sur le disque
}

message SyncRequest {}

message SyncResponse {
  uint32 added = 1;                 // fichiers réconciliés
  repeated FileError errors = 2;    // fichiers écartés, avec leurs diagnostics
}

message ReloadRequest {}

message ReloadResponse {
  uint32 added = 1;
  repeated string removed = 2;      // refs retirées de la vue (fichier disparu)
  repeated FileError errors = 3;
}

// Un fichier écarté par Sync / Reload.
message FileError {
  string path = 1;                  // relatif à la racine
  string message = 2;               // résumé (premier diagnostic, ou raison hors validation)
  repeated Diagnostic diagnostics = 3;
}

message AddRequest {
  string toml = 1;
}

message AddResponse {
  string toml = 1;   // TOML avec l'id injecté
  string id   = 2;
}
