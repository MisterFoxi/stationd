// plugin_v1.proto
// ─────────────────────────────────────────────────────────────────────────
// Pilotage des plugins (CLI-first) : lister l'état, contrôler le cycle de vie.
// Cf. Doc/plugin-hooks.md. Le flux d'événements et la surface hôte ne sont pas
// dans ce contrat (le core notifie / le plugin appelle — hors RPC).
//
// L'état d'un plugin reste VISIBLE même en échec (no-silent-failure) : un
// plugin qui rate son chargement apparaît en `failed` avec sa raison, un
// plugin mis en quarantaine (trop d'échecs) en `quarantined`.

syntax = "proto3";

package webradio.plugin.v1;

service PluginService {
  // État de tous les plugins déclarés (chargés, désactivés, en échec, en
  // quarantaine).
  rpc List(PluginListRequest) returns (PluginListResponse);

  // Applique une action de cycle de vie à un plugin et renvoie son nouvel état.
  rpc Control(PluginControlRequest) returns (PluginControlResponse);
  // Read a declared table; no client-supplied SQL.
  rpc ReadTab(PluginReadTabRequest) returns (PluginDbQueryResponse);

  // Base propre d'un plugin (capacité `db`, cf. Doc/plugin-host.md). Lectures
  // sur une connexion séparée en lecture seule ; le plugin n'est pas touché.
  // Plugin inconnu → NOT_FOUND ; pas de base (capacité absente) ou reset d'un
  // plugin chargé → FAILED_PRECONDITION ; requête refusée → INVALID_ARGUMENT.
  rpc DbInfo(PluginDbInfoRequest) returns (PluginDbInfoResponse);
  rpc DbQuery(PluginDbQueryRequest) returns (PluginDbQueryResponse);
  // Supprime le fichier. Refusé tant que le plugin est chargé ; le prochain
  // démarrage recrée la base et rejoue ses migrations.
  rpc DbReset(PluginDbResetRequest) returns (PluginDbResetResponse);
}

message PluginListRequest {}

message PluginListResponse {
  repeated PluginInfo plugins = 1;
}

message PluginInfo {
  string name     = 1;   // identité (= déclaration)
  bool   enabled  = 2;   // intention de config
  uint32 order    = 3;   // ordre d'application des hooks
  string state    = 4;   // loaded | disabled | failed | quarantined
  string reason   = 5;   // raison si failed/quarantined, sinon vide
  uint32 failures = 6;   // échecs récents (fenêtre glissante)
  // Capacités DÉCLARÉES (surface hôte autorisée) : control, push_override, db.
  repeated string capabilities = 7;
  // Published by the plugin itself, only while loaded; no config/name inference.
  OperatorNotice operator_notice = 8;
  repeated PluginTab tabs = 9;
}

message OperatorNotice {
  enum Code {
    CODE_UNSPECIFIED = 0;
    AUTO_SLEEP = 1;
  }
  Code code = 1;
  // Absent: zero-listener policy. Present: connection-age threshold in seconds.
  optional uint64 max_connection_age = 2;
}

message PluginControlRequest {
  string name   = 1;
  Action action = 2;
  enum Action {
    ACTION_UNSPECIFIED = 0;
    START   = 1;   // réactive un plugin arrêté / en échec  (on_load)
    STOP    = 2;   // désactive un plugin chargé            (on_unload)
    RESTART = 3;   // stop puis start, même artefact
    RELOAD  = 4;   // relit l'artefact (== restart en natif)
  }
}

message PluginControlResponse {
  PluginInfo plugin = 1;
}

message PluginDbInfoRequest {
  string name = 1;
}

message PluginDbInfoResponse {
  string path             = 1;   // fichier de la base (côté daemon)
  bool   exists           = 2;   // false = jamais démarré (ou reset)
  uint64 size_bytes       = 3;
  uint64 schema_version   = 4;   // migrations appliquées
  repeated PluginDbTable tables = 5;   // tables du plugin (hors _stationd*)
  // Bornes effectives ([plugin.db]).
  uint32 max_size_mb      = 6;
  uint32 query_timeout_ms = 7;
  uint32 max_rows         = 8;
}

message PluginDbTable {
  string name = 1;
  uint64 rows = 2;
}

message PluginDbQueryRequest {
  string name = 1;
  string sql  = 2;   // une seule instruction, en lecture seule
}

message PluginDbQueryResponse {
  repeated string    columns = 1;
  repeated PluginDbRow rows  = 2;
}

message PluginDbRow {
  repeated PluginDbValue values = 1;
}

message PluginDbValue {
  oneof kind {
    bool   null    = 1;
    int64  integer = 2;
    double real    = 3;
    string text    = 4;
    bytes  blob    = 5;
  }
}

message PluginDbResetRequest {
  string name = 1;
}

message PluginDbResetResponse {
  bool removed = 1;   // false = il n'y avait pas de fichier
}

message PluginTab {
  string id = 1; // Identity = (plugin name, tab id), stable across reload.
  string title = 2;
  string description = 3;
}
message PluginReadTabRequest {
  string name = 1;
  string tab_id = 2;
}
