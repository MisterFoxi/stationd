syntax = "proto3";
package station;

// Minimal gRPC contract for stationd: just enough to check it's alive and
// ask it to stop. Will grow later (playlists, roles...), but we're
// deliberately starting small.
service Station {
  rpc Status (StatusRequest) returns (StatusReply);
  // Restart-style exit: stationd leaves, its supervisor starts it again.
  rpc Quit (QuitRequest) returns (QuitReply);
  // The operator's stop (`stationctl station stop`): stationd writes the
  // marker data/stationd.stopped (fsync'd — on failure nothing stops), parks
  // Liquidsoap on the background noise (`stationd.park` + `flush`: the
  // current track plays to its end) and exits. The supervisor (s6) sees the
  // marker and does not start it again, even after a restart, until
  // `stationctl station start`. Liquidsoap and Icecast stay up.
  // failed_precondition while a DJ is on air, unless `force` (the DJ is
  // disconnected first).
  rpc Shutdown (ShutdownRequest) returns (ShutdownReply);
  rpc PlaylistAdd (PlaylistAddRequest) returns (PlaylistAddReply);
  rpc PlaylistSync (PlaylistSyncRequest) returns (PlaylistSyncReply);
  rpc PlaylistList (PlaylistListRequest) returns (PlaylistListReply);
}

message StatusRequest {}

message StatusReply {
  string station_name = 1;
  uint64 uptime_seconds = 2;
  uint32 pid = 3;
  string timezone = 4; // IANA station timezone (config)
}

message QuitRequest {}

message QuitReply {}

message ShutdownRequest {
  bool force = 1;   // a DJ on air is disconnected first
}

message ShutdownReply {
  string marker = 1;     // the marker written (path as stationd sees it)
  bool   kicked = 2;     // a DJ was disconnected (force)
  bool   parked = 3;     // Liquidsoap parked on the noise (false: the safety fallback will air)
}

// `playlist add`: the CLI ships the raw TOML content (it does only a
// syntactic pre-check locally, then delegates the I/O of *sending*).
// stationd parses, validates, generates the UUID, updates its SQLite view
// (single writer), and returns the losslessly-rewritten TOML plus the id.
// The CLI then writes that content back to disk.
message PlaylistAddRequest {
  string toml_content = 1;
}

message PlaylistAddReply {
  string toml_content = 1; // rewritten TOML, with the id injected
  string id = 2;           // the effective UUID
}

// `playlist sync`: stationd scans its own playlist root (recursively, from
// `[playlist] path` in its config) and reconciles every *.toml into the
// SQLite view. Best-effort: a bad file is reported, not fatal — the valid
// ones are still applied. stationd reads its own root here (it is the
// legitimate reader of its source-of-truth directory, and will watch it),
// so the CLI passes no path.
message PlaylistSyncRequest {}

message PlaylistSyncReply {
  uint32 added = 1;               // files successfully reconciled
  repeated PlaylistSyncError errors = 2; // files rejected, with reason
}

message PlaylistSyncError {
  string path = 1;    // file that failed (relative to the playlist root)
  string message = 2; // why it was rejected
}

// `playlist list`: read-only listing of what is currently in the view.
message PlaylistListRequest {}

message PlaylistListReply {
  repeated PlaylistSummary playlists = 1;
}

message PlaylistSummary {
  string id = 1;        // internal UUID
  string rel_path = 2;  // human handle (canonical relative path); may be empty for an add-only entry
  string name = 3;      // display name
  string mode = 4;      // selection mode (static/dynamic/remote/queue/group)
  bool enabled = 5;
}
