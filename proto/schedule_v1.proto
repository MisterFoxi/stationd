// schedule_v1.proto
// ─────────────────────────────────────────────────────────────────────────
// La GRILLE : concept top-level distinct qui RÉFÉRENCE des playlists (par
// ref_effective). Répond à « quoi jouer à l'instant now ». C'est le premier
// proto dont modele-programmation.md dit que « le reste du scheduling découle ».
//
// Quatre familles de règles, distinguées par leur POINT D'ANCRAGE :
//   BaseRotation — aucun ancrage, toujours résolvable : le PLANCHER.
//   DayPart      — fenêtre horaire : sélectionne quelle base est active.
//   AtClock      — horloge murale absolue : rendez-vous (top d'heure, news).
//   Every        — dernier passage (temps OU compteur) : cooldown.
//
// Sélection vs injection : BaseRotation/DayPart RÉSOLVENT la base active ;
// AtClock/Every la PONCTUENT (la base reprend derrière).
//
// Ordre de résolution des collisions (priorité décroissante) :
//   AtClock hard > AtClock soft > Every > base (DayPart → BaseRotation)

syntax = "proto3";

package webradio.schedule.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

// ─────────────────────────────────────────────────────────────────────────
// Règle
// ─────────────────────────────────────────────────────────────────────────

message Rule {
  string id = 1;                    // handle stable de la règle (CLI/diagnostics)
  bool   enabled = 2;               // absent → true (service)

  // Portée de validité — « fixe » et « override daté » = MÊME mécanisme, deux
  // formes de validité (simplifie le proto). Vide → toujours valide.
  Validity validity = 3;

  oneof kind {
    BaseRotation base_rotation = 10;
    DayPart      day_part      = 11;
    AtClock      at_clock      = 12;
    Every        every         = 13;
    Live         live          = 14;
  }
}

message Validity {
  // Récurrence : jours de la semaine où la règle s'applique. Vide → tous.
  repeated Weekday days = 1;
  // Bornes de dates optionnelles (override daté). Inclusives. En date CIVILE
  // du fuseau station, pas en instant — l'expansion en epoch applique le DST
  // à la volée (cf. time.md : règle = civil + fuseau IANA, jamais offset gelé).
  string date_start = 2;            // "YYYY-MM-DD", optionnel
  string date_end   = 3;            // "YYYY-MM-DD", optionnel, ≥ date_start
}

enum Weekday {
  WEEKDAY_UNSPECIFIED = 0;
  MON = 1; TUE = 2; WED = 3; THU = 4; FRI = 5; SAT = 6; SUN = 7;
}

// ── Le plancher : toujours résolvable, priorité la plus basse ───────────────
message BaseRotation {
  string playlist_ref = 1;          // ref_effective (typiquement un groupe weighted)
}

// ── Fenêtre qui SÉLECTIONNE quelle base est active ──────────────────────────
// `end` ici = borne de VALIDITÉ d'un prédicat sur `now` (8h ≤ now < 10h),
// évaluée en frontière de piste. JAMAIS une coupe de contenu : la dernière
// piste déborde, le changement se fait au titre suivant (borne molle).
message DayPart {
  string    playlist_ref = 1;       // la base active pendant la fenêtre
  WallClock start = 2;              // heure civile locale, incluse
  WallClock end   = 3;              // heure civile locale, exclue
}

// ── Rendez-vous à l'horloge absolue (recalculable depuis now seul) ──────────
message AtClock {
  string playlist_ref = 1;
  // Exactement un ancrage parmi every_minutes, minute, at.
  // Toutes les N minutes (1..1439) comptées depuis minuit : repères N, 2N…
  // dans la journée, jamais 00:00. Ex. 45 → 00:45 01:30 … 23:15.
  // 0 = pas cet ancrage.
  uint32 every_minutes = 2;
  // OU un repère par heure, à cette minute (0..59) : top horaire, décalé
  // ou non (58 → :58 chaque heure).
  optional uint32 minute = 6;
  // OU une heure fixe unique par jour.
  WallClock at = 3;

  Mode mode = 4;                    // UNSPECIFIED → SOFT
  // Péremption PAR RÈGLE (pas globale) : fenêtre de tolérance d'un rendez-vous
  // manqué (restart à XX:04). Dépassée → périmé, on attend le prochain.
  // Absent → pas de péremption (jingle station « encore bon »).
  google.protobuf.Duration expiry = 5;

  enum Mode {
    MODE_UNSPECIFIED = 0;           // → SOFT
    SOFT = 1;                       // attend la frontière de piste
    HARD = 2;                       // préempte (duck/fade) pour taper l'instant pile
  }
}

// ── Cadence glissante : cooldown depuis le dernier passage ──────────────────
// Toujours soft (évalué en frontière). État PERSISTÉ (famille B) : sans ça un
// restart casse la cadence. Exactement un des deux ancrages.
message Every {
  string playlist_ref = 1;
  oneof cadence {
    google.protobuf.Duration elapsed = 2;   // temps écoulé depuis last_played_at
    uint32                   tracks  = 3;    // pistes station depuis le dernier passage
  }
}

// ── Créneau DJ live : ouvre la fenêtre de CONNEXION du DJ (harbor) ─────────
// Ne sélectionne aucune playlist. Ouverte à `start` jusqu'au prochain début
// d'une autre tranche (day_part ou live). Une fois connecté, le DJ reste à
// l'antenne jusqu'à sa déconnexion ou un silence prolongé (`[live]`).
message Live {
  string    dj    = 1;              // id du fichier des DJ (`[live] djs_path`)
  WallClock start = 2;              // heure civile locale, pas de fin
}

// Heure civile locale (fuseau = config station, pas répété ici).
message WallClock { uint32 hour = 1; uint32 minute = 2; }  // 0..23 / 0..59

// ─────────────────────────────────────────────────────────────────────────
// Résolveur — resolve_next(now, état) -> Decision
// ─────────────────────────────────────────────────────────────────────────

message ResolveNextRequest {
  // Instant d'évaluation. Absent → maintenant. Fourni → simulation (preview),
  // testable sans attendre le wall-clock (stationctl schedule preview --at).
  google.protobuf.Timestamp now = 1;
}
message Decision {
  string media_path   = 1;          // le média concret à tendre à Liquidsoap
  string playlist_ref = 2;          // playlist résolue
  string rule_id      = 3;          // règle gagnante (introspection)
  Origin origin       = 4;
  // OVERRIDE : qui a poussé le contenu (nom de plugin, ou "cli").
  string override_source = 5;
  // HALTED : état de diffusion (paused | stopped). Aucun média, et Liquidsoap
  // ne doit PAS combler (≠ FALLBACK).
  string halted_state = 6;
  enum Origin {
    ORIGIN_UNSPECIFIED = 0;
    AT_CLOCK_HARD = 1;
    AT_CLOCK_SOFT = 2;
    EVERY = 3;
    DAY_PART = 4;
    BASE_ROTATION = 5;              // le plancher a rempli
    FALLBACK = 6;                   // aucune règle → filet de sécurité (jamais un blanc)
    OVERRIDE = 7;                   // file d'override, devant la grille
    HALTED = 8;                     // station en pause / arrêtée : rien à jouer
  }
}

// Une occurrence future (preview). Simule la grille sur une fenêtre.
message Occurrence {
  google.protobuf.Timestamp at_utc = 1;   // instant, epoch UTC
  string at_local = 2;                     // même instant rendu en local nommé (anti-DST)
  string rule_id = 3;
  string playlist_ref = 4;
  Decision.Origin origin = 5;

  // Décomposition d'un groupe référencé par cette occurrence (vide sinon).
  // Les statistiques de pool ne choisissent aucune piste : un membre `take`
  // (per-track) n'a donc jamais de
  // position ; un membre `runtime` d'un `sequence` porte un offset relatif au
  // début du groupe, tant que ses prédécesseurs sont tous `runtime` (un `take`
  // rompt la chaîne). Un `shuffle` a un ordre tiré au runtime → aucun offset.
  string strategy = 6;                     // sequence/shuffle/weighted/rotate ; vide hors groupe
  repeated GroupMember members = 7;

  // Pool courant avant plugins, sans consommer de média. Absent = inconnu,
  // zéro présent = pool vide. Total groupe = somme des pools des membres,
  // sans dédoublonnage ENTRE membres, ni troncature aux quotas take/runtime.
  optional uint64 selected_count = 8;
  // Durée indépendante du count ; précision milliseconde. Un membre
  // remote/queue reprend son runtime déclaré, sinon durée inconnue.
  // Un seul membre de durée inconnue rend le total du groupe inconnu.
  google.protobuf.Duration total_duration = 9;
}

// Un membre d'un groupe, tel que PROJETÉ dans le preview (pas résolu : aucun
// média concret ici).
message TakeRandomQuota {
  uint32 min = 1;
  uint32 max = 2;
}

message GroupMember {
  string ref = 1;                          // ref du membre
  oneof quota {
    TakeRandomQuota take_random = 7;       // inclusive random track quota
    uint32 take = 2;                       // quota en pistes — jamais de position (durée inconnue)
    google.protobuf.Duration runtime = 3;  // budget temps
  }
  // Décalage du début de ce membre depuis le début de l'activation du groupe,
  // quand il est calculable (membre `runtime` d'un `sequence` dont tous les
  // prédécesseurs sont `runtime`). Absent pour un `take`, pour tout membre
  // situé après un `take`, et pour tout membre d'un `shuffle`.
  google.protobuf.Duration offset = 4;
  optional uint64 selected_count = 5;       // absent = inconnu, zéro = pool vide
  google.protobuf.Duration total_duration = 6; // pool local ou runtime remote/queue
}

// Une règle prise en compte mais non plaçable sur l'horloge (un `every` au
// compteur de pistes, dont la cadence suit la lecture réelle). Listée à part
// du preview, jamais injectée dans la timeline ordonnée d'occurrences.
message IndicativeRule {
  string rule_id = 1;
  string playlist_ref = 2;
}

// ─────────────────────────────────────────────────────────────────────────
// Service grille (CLI-first — stationctl schedule …)
// ─────────────────────────────────────────────────────────────────────────

service ScheduleService {
  // CRUD grille (comme playlists : apply/validate/export sur TOML → contrat).
  // ApplyGrid : le TOML envoyé DEVIENT le fichier de la grille active (écrit
  // par stationd, remplacé), puis est appliqué. Invalide : ok = false +
  // diagnostics, rien d'écrit ni d'appliqué.
  rpc ApplyGrid(ApplyGridRequest)   returns (ApplyGridResponse);
  // Rien d'écrit ni d'appliqué : tous les problèmes, chacun sur son champ.
  rpc ValidateGrid(ApplyGridRequest) returns (ValidateGridResponse);
  rpc ExportGrid(ExportGridRequest) returns (ExportGridResponse);
  rpc ListRules(ListRulesRequest)   returns (ListRulesResponse);

  // Fichiers de grille (`[grid] path`, `grid/` par défaut) : plusieurs
  // grilles, UNE active (choix gardé en base ; aucune = grid.toml). Le
  // fichier actif fait foi : relu au démarrage et par ReloadGrid ; absent ou
  // invalide, la dernière grille appliquée reste à l'antenne.
  rpc ListGrids(ListGridsRequest)       returns (ListGridsResponse);
  rpc GetGrid(GetGridRequest)           returns (GetGridResponse);
  // Écrit par stationd (révision = empreinte du contenu, conflit si le
  // fichier a changé, écriture atomique relue) ; appliquée si c'est la
  // grille active.
  rpc SaveGrid(SaveGridRequest)         returns (SaveGridResponse);
  rpc ActivateGrid(ActivateGridRequest) returns (ActivateGridResponse);
  rpc ReloadGrid(ReloadGridRequest)     returns (ActivateGridResponse);

  // Le résolveur en direct : ce que Liquidsoap demande à chaque frontière.
  // Remplace l'Activate stub du slice comme vrai point d'entrée.
  rpc ResolveNext(ResolveNextRequest) returns (Decision);

  // Simulation sans wall-clock : stationctl schedule preview --at / --next 24h.
  // Sert de test anti-DST (fenêtre sur nuit de bascule → révèle trou/doublon).
  rpc Preview(PreviewRequest) returns (PreviewResponse);

  // Dimensionnement : « la grille a-t-elle assez de média ? ». Pour chaque
  // règle active, inspecte le pool de sa playlist (read-only, aucun playout,
  // aucune mutation famille B) et rend un verdict — pool vide / ref cassée,
  // anti-répétition ou `limit` non tenable, source FINIE plus courte que son
  // créneau. « Signalé, pas jugé » : le verdict qualifie, il ne bloque rien.
  rpc CheckCoverage(CheckCoverageRequest) returns (CheckCoverageResponse);

  // Enqueue un média dans le tampon runtime d'une playlist `queue` (demande
  // auditeur / injection DJ). Refusé si la queue est à son max_len.
  rpc Enqueue(EnqueueRequest) returns (EnqueueResponse);

  // Horloge manuelle (test) : fige/relâche l'instant que ResolveNext utilise
  // quand la requête ne fournit pas `now`. Sans changement demandé → reporte.
  rpc SetClock(SetClockRequest) returns (ClockStatus);
}

message GridFile { string path = 1; string toml = 2; }
message ApplyGridRequest    { repeated GridFile files = 1; }
message ApplyGridResponse {
  bool ok = 1;
  repeated string applied_rule_ids = 2;
  repeated GridDiagnostic diagnostics = 3;   // ok = false : pourquoi
  string grid = 4;                           // le fichier de grille écrit (la grille active)
}
message ValidateGridResponse {
  bool ok = 1;
  repeated GridDiagnostic diagnostics = 2;
}

// Un problème d'une grille, sur son champ. `field_path` dans la grammaire :
// `rule[3].start` (règles numérotées à partir de 1, dans l'ordre du
// fichier), `schema_version` ; vide = le fichier entier.
message GridDiagnostic {
  string file       = 1;   // fichier envoyé / grille concernée
  string field_path = 2;
  string rule_id    = 3;   // la règle, quand le problème est dans une règle
  string rejected   = 4;   // valeur rejetée, telle qu'écrite
  string expected   = 5;   // valeurs admises quand elles sont finies
  string message    = 6;   // phrase anglaise (stationctl) ; les clients traduisent par `code`
  Code   code       = 7;
  enum Code {
    CODE_UNSPECIFIED   = 0;
    SYNTAX             = 1;   // TOML illisible
    UNKNOWN_FIELD      = 2;
    MISSING_FIELD      = 3;
    BAD_VALUE          = 4;   // type ou forme invalide (ex. kind inconnu)
    NOT_ALLOWED        = 5;   // champ d'un autre kind
    CONFLICT           = 6;   // champs qui s'excluent (every_minutes / minute / at…)
    BAD_DURATION       = 7;   // 30s, 15m, 2h, 1d
    BAD_TIME           = 8;   // HH:MM
    BAD_DATE           = 9;   // YYYY-MM-DD
    BAD_WEEKDAY        = 10;  // mon … sun, sans doublon
    SCHEMA_VERSION     = 11;
    DUPLICATE_ID       = 12;
    SEVERAL_FLOORS     = 13;  // plus d'un base_rotation
    ZERO_WINDOW        = 14;  // start = end
    DATES_REVERSED     = 15;  // date_end avant date_start
    OUT_OF_RANGE       = 16;  // every_minutes hors 1..1439, minute > 59, min_tracks < 1
    UNKNOWN_REF        = 17;  // playlist inconnue
    BAD_REF            = 18;  // ref invalide
    UNKNOWN_DJ         = 19;  // dj absent du fichier des DJ
    NO_LIVE            = 20;  // règle live sans [live]
    DJ_FILE_UNREADABLE = 21;
    FILE_UNREADABLE    = 22;  // le fichier de grille ne se lit pas (droits, disque…)
  }
}

message ListGridsRequest {}
message ListGridsResponse {
  repeated GridInfo grids = 1;
  string active = 2;
}
message GridInfo {
  string name     = 1;   // fichier du répertoire des grilles (« grid.toml »)
  string revision = 2;   // vide = pas de fichier (grille active sans fichier)
  bool   active   = 3;
  optional uint32 rules = 4;   // absent = ne se lit pas
  // Pourquoi elle ne s'appliquerait pas telle quelle (le premier problème) ;
  // absent = rien. Pour l'active : aussi l'échec du dernier chargement
  // (démarrage, reload) — la dernière grille appliquée est restée.
  GridDiagnostic problem = 5;
}

message GetGridRequest { string name = 1; }   // vide = la grille active
message GetGridResponse {
  string name     = 1;
  string toml     = 2;   // le fichier, commentaires compris ; vide = pas encore de fichier
  string revision = 3;   // vide = pas de fichier
  bool   active   = 4;
  bool   exists   = 5;
  // Grille active : le fichier ne dit plus ce qui est appliqué (modifié à la
  // main depuis, ou invalide donc pas appliqué).
  bool   differs_from_applied = 6;
}

message SaveGridRequest {
  string name = 1;
  string toml = 2;
  string expected_revision = 3;   // vide = création (conflit si le fichier existe)
}
message SaveGridResponse {
  bool ok = 1;                    // écrit (et appliqué si active)
  bool conflict = 2;              // révision périmée : rien d'écrit
  string revision = 3;            // après écriture ; l'actuelle sinon
  repeated GridDiagnostic diagnostics = 4;
  bool created = 5;
  bool applied = 6;               // c'est la grille active : elle est à l'antenne
}

message ActivateGridRequest { string name = 1; }
message ReloadGridRequest {}
message ActivateGridResponse {
  bool ok = 1;
  string name = 2;                // la grille active
  uint32 rules = 3;
  bool missing = 4;               // pas de fichier : la dernière grille appliquée reste
  repeated GridDiagnostic diagnostics = 5;   // ok = false : pourquoi (rien n'a changé)
}
message ExportGridRequest   { repeated string rule_ids = 1; }
message ExportGridResponse  { repeated GridFile files = 1; }
message ListRulesRequest {
  string grid = 1;          // une grille du nœud au lieu de la grille appliquée
  string draft_toml = 2;    // ou un brouillon (l'emporte)
}
message ListRulesResponse   { repeated Rule rules = 1; }

message PreviewRequest {
  google.protobuf.Timestamp from = 1;      // absent → maintenant
  google.protobuf.Duration  window = 2;    // ex. 24h
  // Projeter autre chose que la grille appliquée, sans rien appliquer :
  // `draft_toml` (un brouillon) l'emporte sur `grid` (un fichier de grille).
  // Invalide (grammaire) → invalid_argument.
  string grid = 3;
  string draft_toml = 4;
}
message PreviewResponse {
  repeated Occurrence occurrences = 1;      // timeline ordonnée, instants réels
  repeated IndicativeRule indicative = 2;   // règles en jeu mais non projetables
  // Fenêtres de connexion des DJ (règles `live`) sur la projection, dans
  // l'ordre d'ouverture. Posées sur le programme, jamais dans `occurrences`.
  repeated LiveWindow live = 3;
}

// Une fenêtre de connexion d'un DJ vue par le preview (minute près).
message LiveWindow {
  string rule_id = 1;
  string dj = 2;                             // id du fichier des DJ
  google.protobuf.Timestamp opens_at = 3;    // 1re minute ouverte DANS la projection
  string opens_local = 4;
  bool open_before = 5;                      // déjà ouverte au début : ouverte plus tôt
  google.protobuf.Timestamp closes_at = 6;   // 1re minute fermée ; absent = encore ouverte à la fin
  string closes_local = 7;
}

// Horloge manuelle. `real = true` → repasse en temps réel. Sinon `at` (s'il
// est fourni) fige l'instant. Ni `real` ni `at` → aucun changement, reporte
// juste l'état courant (sert de « clock show »).
message SetClockRequest {
  bool real = 1;
  // Heure civile locale : "HH:MM" (aujourd'hui) ou "YYYY-MM-DD HH:MM". Le
  // daemon convertit avec le fuseau station. Vide et real=false → aucun
  // changement, reporte juste l'état (« clock show »).
  string at = 2;
}
message ClockStatus {
  bool frozen = 1;                         // true si une horloge manuelle est active
  google.protobuf.Timestamp effective = 2; // l'instant que ResolveNext utilisera
  string effective_local = 3;              // le même instant rendu en local nommé
}

// ─────────────────────────────────────────────────────────────────────────
// CheckCoverage — preview de DIMENSIONNEMENT (pas de playout)
// ─────────────────────────────────────────────────────────────────────────

// Verdict d'une entrée (enum fermé — atteignable au contrat). Croissant en
// gravité : le pire l'emporte au niveau grille.
enum Verdict {
  VERDICT_UNSPECIFIED = 0;
  OK           = 1;   // le pool couvre ce que la règle demande
  THIN         = 2;   // ⚠ tient, mais juste (rejeu forcé, quota non plein, créneau à peine couvert)
  INSUFFICIENT = 3;   // ✗ pool vide, ref cassée, membre indispensable manquant
}

message CheckCoverageRequest {
  // Vide → toute la grille (règles activées). Sinon restreint à ces rule_ids.
  repeated string rule_ids = 1;
  string grid = 2;          // comme PreviewRequest
  string draft_toml = 3;
}

message CheckCoverageResponse {
  repeated CoverageEntry entries = 1;
  Verdict worst = 2;                       // pire verdict de la grille (résumé / exit code)
}

// Une règle de la grille et le dimensionnement du pool qu'elle référence.
message CoverageEntry {
  string rule_id = 1;
  string playlist_ref = 2;
  string kind = 3;                         // base_rotation | day_part | at_clock | every
  optional uint64 selected_count = 4;      // médias du pool ; absent = non mesurable (remote/queue)
  google.protobuf.Duration total_duration = 5; // durée cumulée du pool ; absente = inconnue
  Verdict verdict = 6;
  string detail = 7;                       // ce qui a fait le verdict, en français (stationctl)
  repeated CoverageMember members = 8;     // décomposition d'un groupe (vide sinon)
  repeated CoverageReason reasons = 9;     // la même chose en opcodes (à traduire) ; vide = ok
}

// Une cause de verdict : opcode + paramètres typés, traduits par le client
// (jamais de texte à afficher envoyé par stationd, dossier TUI D12).
message CoverageReason {
  enum Code {
    CODE_UNSPECIFIED = 0;
    POOL_EMPTY = 1;             // pool vide
    TRACK_REPEAT = 2;           // no_same_track_within `window` > pool `pool_ms`
    TITLE_REPEAT = 3;           // no_same_title_within `window` > pool `pool_ms`
    ARTIST_REPEAT = 4;          // no_same_artist_within : `count` artiste(s) distinct(s)
    ARTIST_NOT_EVALUATED = 5;   // no_same_artist_within non évalué (agrégat de groupe)
    LIMIT_UNMET = 6;            // limit `limit` > `count` médias distincts
    FINITE_SHORT = 7;           // source finie `pool_ms` < créneau `need_ms`
    MEMBERS_EMPTY_ABORT = 8;    // membres vides `refs` → abort
    MEMBERS_EMPTY_SKIP = 9;     // membres vides `refs` → skip (dégradé)
    MEMBERS_LOOP = 10;          // membres sous-dimensionnés `refs` → boucle
    BAD_REF = 11;               // ref invalide (`error`)
    UNKNOWN_PLAYLIST = 12;      // playlist inconnue
    UNREADABLE_PLAYLIST = 13;   // playlist illisible (`error`)
    UNRESOLVABLE = 14;          // pool non résolvable (`error`)
    RUNTIME_LOOP = 15;          // membre : runtime `need_ms` > pool `pool_ms` → boucle
    TAKE_REPEAT = 16;           // membre : take `limit` > `count` pistes → répétition
  }
  Code code = 1;
  string window = 2;             // fenêtre anti-répétition telle qu'écrite (« 2h »)
  optional uint64 pool_ms = 3;
  optional uint64 need_ms = 4;
  optional uint64 count = 5;
  optional uint64 limit = 6;     // limit, ou take d'un membre
  repeated string refs = 7;
  string error = 8;              // message technique relayé tel quel (non traduit)
}

// Un membre d'un groupe, dimensionné à part (localise le maillon faible).
message CoverageMember {
  string ref = 1;
  optional uint64 selected_count = 2;
  google.protobuf.Duration total_duration = 3;
  Verdict verdict = 4;
  string detail = 5;
  repeated CoverageReason reasons = 6;
}

// ──────────────────────────────────────────────────────────────
// Enqueue — pousser dans le tampon runtime d'une playlist `queue`
// ──────────────────────────────────────────────────────────────

message EnqueueRequest {
  string playlist_ref = 1;   // la playlist queue visée
  string media_path = 2;     // rel_path du média à pousser
}

message EnqueueResponse {
  bool   accepted = 1;       // false = refusé (queue au max_len)
  uint64 len      = 2;       // longueur du tampon après le push
}
