# Plugin WASM de démonstration (WASM-1) : require-title.
# Crate SÉPARÉ du binaire stationd — [workspace] vide = racine autonome, donc
# `cargo build` de stationd ne le compile pas, et vice-versa. Se compile à la
# main pour la cible wasm :
#   cargo build --release --target wasm32-unknown-unknown
# Produit : target/wasm32-unknown-unknown/release/require_title_wasm.wasm
[package]
name = "require-title-wasm"
version = "0.1.0"
edition = "2021"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
extism-pdk = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
