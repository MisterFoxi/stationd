# Plugin WASM configurable : blacklist. Crate SÉPARÉ ([workspace] vide).
#   cargo build --release --target wasm32-unknown-unknown
# → target/wasm32-unknown-unknown/release/blacklist_wasm.wasm
[package]
name = "blacklist-wasm"
version = "0.1.0"
edition = "2021"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
extism-pdk = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
