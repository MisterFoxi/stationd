# Plugin WASM `custom-tags` : tags personnalisés (TXXX…) → genres, au scan.
# Crate SÉPARÉ du binaire stationd — [workspace] vide = racine autonome, donc
# `cargo build` de stationd ne le compile pas, et vice-versa. Se compile à la
# main pour la cible wasm :
#   cargo build --release --target wasm32-unknown-unknown
# Produit : target/wasm32-unknown-unknown/release/custom_tags_wasm.wasm
[package]
name = "custom-tags-wasm"
version = "0.1.0"
edition = "2021"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
extism-pdk = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
