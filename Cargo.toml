[package]
name = "stationd"
version = "0.1.0"
edition = "2021"
default-run = "stationd"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Workspace : le daemon (ce paquet, racine) + les clients hors daemon.
# `cargo build` / `cargo test` à la racine ne visent que stationd (paquet
# racine = membre par défaut) ; la TUI se compile avec `-p stationd-tui`.
# Les plugins WASM (plugins/*) restent des racines autonomes ([workspace] vide).
[workspace]
members = [".", "crates/stationd-proto", "crates/stationd-tui", "crates/stationd-client-config"]
default-members = ["."]
exclude = ["plugins"]

[dependencies]
stationd-client-config = { path = "crates/stationd-client-config" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net", "io-util"] }
tonic = { version = "0.12", features = ["tls-native-roots"] }
prost = "0.13"
prost-types = "0.13"
tokio-stream = "0.1"   # flux serveur gRPC (OnAirService.Watch) ; déjà dans l'arbre via tonic
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
toml_edit = "0.22"
rustfft = "6.4" # Spectral flux for offline BPM estimation.
walkdir = "2"
sha2 = "0.10"          # révision d'un fichier de playlist (empreinte du contenu) ; déjà dans l'arbre via sqlx
jiff = "0.2"
lofty = "0.24"          # lecture tags + durée (mp3/flac/ogg/opus/m4a/wav…), pur-Rust
rand = "0.8"            # tirage shuffle en mémoire (pool matérialisé, filtrable)
rand_chacha = "0.3"     # tirages reproductibles (`draw`) : la simulation tire ce que tirera l'antenne
extism = "1"            # runtime WASM hôte pour les plugins (tire wasmtime)
serde_json = "1"        # sérialisation à la frontière host↔wasm
axum = { version = "0.7", default-features = false, features = ["tokio", "http1", "json"] }  # pont HTTP loopback Liquidsoap → stationd
# Lecture de l'API admin Icecast (stationd → Icecast, HTTP simple). hyper / hyper-util /
# http-body-util / bytes / base64 sont déjà dans l'arbre (axum, tonic) : seul roxmltree est neuf.
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
bytes = "1"
base64 = "0.22"        # en-tête Basic auth
roxmltree = "0.20"     # lecture de /admin/stats (XML)
libc = "0.2"           # groupe du fichier icecast.xml (getgrnam_r / getgrgid_r) ; déjà dans l'arbre
argon2 = "0.5"         # empreintes des mots de passe DJ (fichier des DJ, [live])
# Base SQLite propre à chaque plugin (capacité `db`), synchrone : les plugins sont appelés
# depuis leur tâche, un appel hôte ne peut pas attendre sqlx. Version alignée sur sqlx 0.7
# (même libsqlite3-sys 0.27 : une seule copie de SQLite liée). hooks = autorisation +
# délai par requête ; limits = ATTACH interdit au niveau du moteur.
rusqlite = { version = "0.30", features = ["hooks", "limits"] }

# Local DB-IP City Lite MMDB lookups; no network or mmap feature.
maxminddb = { version = "0.24", default-features = false }

# Webmin passkeys: safe WebAuthn API; vendored crypto avoids a system libssl requirement.
webauthn-rs = "=0.5.5"
openssl = { version = "0.10", features = ["vendored"] }
subtle = "2"

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
tempfile = "3"
webauthn-authenticator-rs = { version = "=0.5.5", default-features = false, features = ["softpasskey"] }
tower = { version = "0.5", features = ["util"] }   # oneshot sur le routeur du pont LS

[profile.dev]
debug = "line-tables-only"   # backtraces avec numéros de ligne, sans les infos de debug complètes