[package]
name = "stationd"
version = "0.1.0"
edition = "2021"
default-run = "stationd"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
tui = ["dep:ratatui", "dep:crossterm", "dep:tempfile"]

[[bin]]
name = "stationd-tui"
path = "src/bin/stationd-tui/main.rs"
required-features = ["tui"]

[dependencies]
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }
tempfile = { version = "3", optional = true }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
toml_edit = "0.22"
walkdir = "2"
jiff = "0.2"
lofty = "0.24"          # lecture tags + durée (mp3/flac/ogg/opus/m4a/wav…), pur-Rust
rand = "0.8"            # tirage shuffle en mémoire (pool matérialisé, filtrable)
extism = "1"            # runtime WASM hôte pour les plugins (tire wasmtime)
serde_json = "1"        # sérialisation à la frontière host↔wasm
axum = { version = "0.7", default-features = false, features = ["tokio", "http1", "json"] }  # pont HTTP loopback Liquidsoap → stationd

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }   # oneshot sur le routeur du pont LS

[[plugin]]
name = "logger"
enabled = true
order = 50