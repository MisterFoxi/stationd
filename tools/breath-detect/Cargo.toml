[package]
name = "breath-detect"
version = "0.1.0"
edition = "2021"
description = "Détecteur de respirations Suno sur stem vocal (spec v1). CLI autonome Linux/Windows."

[[bin]]
name = "breath-detect"
path = "src/main.rs"

[dependencies]
hound = "3.5"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
