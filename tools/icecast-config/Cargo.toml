[package]
name = "station-icecast-config"
version = "1.0.0"
edition = "2021"
publish = false

# Outil autonome : ne compile ni StationD, ni ses plugins.
[workspace]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"
sha2 = "0.10"
maxminddb = { version = "0.24", default-features = false }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
roxmltree = "0.20"
tempfile = "3"

