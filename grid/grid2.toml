# grid.toml
# ─────────────────────────────────────────────────────────────────────────
# La GRILLE : décide quoi jouer à l'instant `now`. Fichier unique, conteneur
# [[rule]]. Chaque règle : id + kind + playlist_ref ; `kind` gouverne les
# champs permis. Ordre de collision :
#   at_clock hard > at_clock soft > every > day_part > base_rotation > fallback
#
# Refs = playlist_ref (rel_path de la vue). Doivent exister sinon `apply` rejette.

schema_version = 1



[[rule]]
id = "floor"
kind = "base_rotation"
playlist_ref = "rotation"




