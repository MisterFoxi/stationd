<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StationD — Réseau</title>
<link rel="stylesheet" href="/remote.css">
<script src="/i18n.js" defer></script>
<script src="/remote.js" defer></script>
<body data-page="network"><main>
<header><h1>Réseau StationD</h1><button id="logout">Se déconnecter</button></header>
<p id="account"></p><p id="connection" role="status">Connexion aux stations…</p>
<div class="network-table-scroll" role="region" aria-label="Stations accessibles" tabindex="0">
<table class="network-table">
<caption>Stations accessibles</caption>
<thead><tr><th scope="col">Station</th><th scope="col">État</th><th scope="col">À l’antenne</th><th scope="col" class="network-audience">Connexions</th><th scope="col">Observation</th><th scope="col">Alertes</th></tr></thead>
<tbody id="stations"></tbody>
<tfoot><tr><th scope="row" colspan="3">Total des connexions</th><td id="network-total" class="network-audience">—</td><td colspan="2" id="network-total-note" class="muted"></td></tr></tfoot>
</table></div>
<p id="message" role="status"></p>
</main></body></html>
