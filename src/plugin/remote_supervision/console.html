<!doctype html>
<html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StationD — Console</title>
<link rel="stylesheet" href="/remote.css"><link rel="stylesheet" href="/terminal/xterm.css">
<script src="/terminal/xterm.js" defer></script><script src="/terminal/fit.js" defer></script><script src="/console.js" defer></script>
<body data-station-id="{{STATION_ID}}" class="console-page"><main>
<a id="back">← Retour à la station</a>
<header><h1 id="station-name">Console de la station</h1><button id="logout">Se déconnecter</button></header>
<p id="account"></p><p>Console d’administration StationD. Vos commandes agissent sur la station indiquée ci-dessus.</p>
<p id="message" role="status">Chargement…</p>
<p><button id="start" disabled>Ouvrir la console</button> <button id="close" disabled>Fermer la console</button></p>
<div id="terminal" aria-label="Console StationD"></div>
</main></body></html>
