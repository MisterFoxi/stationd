<!doctype html>
<html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StationD — Console</title>
<link rel="stylesheet" href="/remote.css"><link rel="stylesheet" href="/terminal/xterm.css">
<script src="/i18n.js" defer></script><script src="/terminal/xterm.js" defer></script><script src="/terminal/fit.js" defer></script><script src="/console.js" defer></script>
<body data-station-id="{{STATION_ID}}" class="console-page"><main>
<a id="back" href="/">← Synthèse réseau</a>
<header><h1 id="station-name">Console de la station</h1><button id="logout">Se déconnecter</button></header>
<p id="account"></p>
<p id="message" role="status"></p>
<div id="terminal-status" role="status" aria-live="polite">
<span id="connection-state">DISCONNECTED</span>
<span id="focus-state">TERMINAL NOT FOCUSED</span>
<span id="application-state">UNKNOWN</span>
<span id="input-activity" aria-live="off"></span>
</div>
<p id="focus-help">Cliquez dans le terminal pour y diriger le clavier.</p>
<div id="terminal" aria-label="Console StationD" aria-describedby="focus-help"></div>
</main></body></html>
