# Banc de bascule immédiate MP3 : entrées de format identique, reservoir désactivé.
# Endpoint omitted: signed discovery via STATIONDECK_SERVICE_CATALOG.
# An explicit icecast_url HTTP origin takes priority when configured.
output_mount = "/radio.mp3"
output_password_file = "source-radio-password"
default_input = "a"

[[inputs]]
id = "a"
mount = "/test-a.mp3"

[[inputs]]
id = "b"
mount = "/test-b.mp3"

