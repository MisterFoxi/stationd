name: stationd-v1-icecast
services:
  icecastd:
    build:
      context: ../..
      dockerfile: docker/icecast/Dockerfile
      target: server
    image: stationd-v1-icecast:dev
    depends_on:
      monitor:
        condition: service_started
    entrypoint: [python3, /usr/local/lib/stationdeck/icecast-managed.py]
    labels:
      stationdeck.configuration.managed: 'true'
    environment:
      STATIONDECK_AGENT_CONFIG: /bootstrap/icecast-agent.json
      STATIONDECK_CONFIG_ENDPOINT: ${STATIONDECK_CONFIG_ENDPOINT:-}
    networks: [default, configuration]
    init: true
    ports:
      - "${ICECAST_BIND:-192.168.1.118}:${ICECAST_PORT:-18000}:8000"
    volumes:
      - ../../config/icecast:/etc/stationd:ro
      - ../../data/geoip:/data/geoip:ro
      - ../../config/stationdeck:/bootstrap:ro
      - config-icecast-state:/data
      - config-icecast-effective:/managed
      - type: volume
        source: deck-agent-secrets
        target: /credential
        read_only: true
        volume:
          subpath: icecastd-1
    secrets:
      - admin-password
      - source-a-password
      - source-b-password
      - source-radio-password
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1:8000/status-json.xsl"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    stop_grace_period: 10s

  admin:
    build:
      context: ../..
      dockerfile: docker/icecast/Dockerfile
      target: administration
    image: stationd-v1-admin:dev
    command: ["--bind", "0.0.0.0:50061", "--settings", "/etc/stationd/admin.toml", "--effective-config", "/managed/icecast.toml"]
    depends_on:
      icecastd:
        condition: service_healthy
    ports:
      - "127.0.0.1:${STATION_ADMIN_PORT:-50061}:50061"
    volumes:
      - ../../config/icecast:/etc/stationd:ro
      - ../../data/geoip:/data/geoip:ro
      - admin-state:/var/lib/station-admin
      - config-icecast-effective:/managed:ro
    secrets:
      - admin-password
      - admin-api-token
      - router-api-token
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "stationctl", "icecast", "status"]
      interval: 5s
      timeout: 12s
      retries: 6
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    stop_grace_period: 10s

  smoke:
    profiles: [test]
    build:
      context: ../..
      dockerfile: docker/icecast/Dockerfile
      target: test-tools
    depends_on:
      icecastd:
        condition: service_healthy
      admin:
        condition: service_healthy
    environment:
      ICECAST_URL: http://icecastd:8000
      STATION_ADMIN_URL: http://admin:50061
    secrets:
      - admin-password
      - admin-api-token
      - source-a-password
      - source-b-password


  live-a:
    profiles: [live]
    build:
      context: ../..
      dockerfile: docker/icecast/Dockerfile
      target: test-tools
    image: stationd-v1-icecast-live:dev
    entrypoint: ["python3", "/test/live-source.py"]
    environment:
      SOURCE_LABEL: a
    depends_on:
      icecastd:
        condition: service_healthy
    secrets:
      - source-a-password
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  live-b:
    profiles: [live]
    image: stationd-v1-icecast-live:dev
    entrypoint: ["python3", "/test/live-source.py"]
    environment:
      SOURCE_LABEL: b
    depends_on:
      icecastd:
        condition: service_healthy
    secrets:
      - source-b-password
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped


  router:
    profiles: [switch]
    build:
      context: ../..
      dockerfile: docker/icecast/Dockerfile
      target: administration
    image: stationd-v1-admin:dev
    entrypoint: ["station-router"]
    command: ["--bind", "0.0.0.0:50062"]
    depends_on:
      icecastd:
        condition: service_healthy
    volumes:
      - ../../config/icecast/router.toml:/etc/stationd/router.toml:ro
      - router-state:/var/lib/station-router
    secrets:
      - source-radio-password
      - router-api-token
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    stop_grace_period: 5s

  monitor:
    build:
      context: ../..
      dockerfile: docker/icecast/Dockerfile
      target: monitoring
    image: stationd-v1-monitor:dev
    volumes:
      - ../../config/icecast:/etc/stationd:ro
      - ../../data/geoip:/data/geoip:ro
      - ../../.local/icecast/backups:/central-backups:ro
      - admin-state:/central-admin:ro
      - router-state:/central-router:ro
      - monitor-state:/var/lib/station-monitor
    secrets:
      - admin-api-token
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "stationctl", "--addr", "http://127.0.0.1:50063", "monitor-status"]
      interval: 30s
      timeout: 5s
      retries: 2
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    stop_grace_period: 10s

secrets:
  admin-password:
    file: ../../.local/icecast/secrets/admin-password
  admin-api-token:
    file: ../../.local/icecast/secrets/admin-api-token
  source-a-password:
    file: ../../.local/icecast/secrets/source-a-password
  source-b-password:
    file: ../../.local/icecast/secrets/source-b-password


  source-radio-password:
    file: ../../.local/icecast/secrets/source-radio-password
  router-api-token:
    file: ../../.local/icecast/secrets/router-api-token

volumes:
  admin-state:
  router-state:
  monitor-state:
  config-icecast-state:
  config-icecast-effective:
  deck-agent-secrets:
    external: true
    name: ${STATIONDECK_AGENT_SECRETS_VOLUME:-stationdeck_config-agent-secrets}
networks:
  configuration:
    external: true
    name: ${STATIONDECK_CONFIGURATION_NETWORK:-stationdeck-configuration}