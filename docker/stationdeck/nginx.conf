worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    resolver 127.0.0.11 valid=2s ipv6=off;
    resolver_timeout 2s;
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    gzip on;
    gzip_types application/javascript text/javascript application/wasm text/css;
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Cache-Control "no-cache" always;
        location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
        location /api/config/ {
            set $configuration_backend control:8080;
            proxy_pass http://$configuration_backend;
            proxy_read_timeout 7s;
            proxy_set_header Authorization $http_authorization;
        }
        location /api/ {
            set $status_backend gateway:8080;
            proxy_pass http://$status_backend;
            proxy_read_timeout 10s;
            proxy_set_header Authorization $http_authorization;
        }
        location / { try_files $uri $uri/ =404; }
    }
}
