# Exploitation d'un nœud stationd. Tout est dans le répertoire de ce fichier
# (/opt/stationd par défaut, cf. install.sh), monté tel quel dans le
# conteneur en /var/lib/stationd (répertoire de travail de stationd) :
#
#   compose.yaml  .env              installés par install.sh
#   stationd.toml …                 à vous (config, fichier des DJ…)
#   grid/                           grilles (une active), écrites aussi par stationd
#   playlist/  radio/               playlists, fallback + bruit de fond
#   data/                           écrit par stationd (base, .liq, icecast.xml)
name: stationd
services:
  station:
    image: stationd:${STATIOND_VERSION:?STATIOND_VERSION manquant (.env)}
    # Réseau de l'hôte : Icecast voit la vraie IP du reverse proxy
    # (trusted_proxies) ; ports 8000 (Icecast), 127.0.0.1:50051 (gRPC),
    # 127.0.0.1:8081 (pont Liquidsoap), 8005 (harbor DJ, si [live] :
    # à ouvrir aux DJ).
    network_mode: host
    environment:
      TZ: ${TZ:-UTC}
      # Identités appliquées au démarrage par init-perms.
      STATIOND_UID: ${STATIOND_UID:?STATIOND_UID manquant (.env)}
      STATIOND_GID: ${STATIOND_GID:?STATIOND_GID manquant (.env)}
      # STATIOND_PATH_GROUPS
    volumes:
      - .:/var/lib/stationd
      # Générés depuis les chemins médias/playlists/grilles/base du TOML.
      # STATIOND_EXTERNAL_VOLUMES
    restart: unless-stopped
    stop_grace_period: 15s
